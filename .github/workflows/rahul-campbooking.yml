name: Build and Deploy CampBooking API

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: rahul-campbooking
  DOTNET_VERSION: 8.0.x

jobs:

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Packages
        run: dotnet restore Capstone/CampBookingSolution/CampBookingSolution.sln

      - name: Build Solution
        run: dotnet build Capstone/CampBookingSolution/CampBookingSolution.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Capstone/CampBookingSolution/CampBookingSolution.sln --configuration Release --no-build

      - name: Publish API
        run: dotnet publish Capstone/CampBookingSolution/CampBooking.API/CampBooking.API.csproj --configuration Release --output ./publish

      - name: Upload Publish Folder
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download Published Files
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.rahul_campbooking_CLIENT_ID_0176 }}
          tenant-id: ${{ vars.rahul_campbooking_TENANT_ID_D793 }}
          subscription-id: ${{ vars.rahul_campbooking_SUBSCRIPTION_ID_D793 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: rahul-campbooking
          package: ./publish