name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "./frontend/CampBooking_Frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd ./frontend/CampBooking_Frontend
          npm ci

      - name: Build application
        env:
          VITE_API_BASE_URL: https://campbooking-module6-fyezbbfwhdfaeqdc.centralindia-01.azurewebsites.net/api
        run: |
          cd ./frontend/CampBooking_Frontend
          npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_0D33CD900 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          app_location: "./frontend/CampBooking_Frontend/dist"
          api_location: ""
          output_location: ""

          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_0D33CD900 }}
          action: "close"
          